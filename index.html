<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thunderstorm Survival - Love Nadeesha Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d0614;
            color: #ff79c6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .header {
            text-align: center;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 22px;
            color: #ff2a85;
            text-shadow: 0 0 10px #ff2a85;
        }
        .subtitle {
            font-size: 13px;
            color: #bd93f9;
            margin-top: 4px;
        }
        #game-container {
            position: relative;
            border: 3px solid #ff79c6;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(255, 121, 198, 0.4);
            background: #05020a;
        }
        canvas {
            display: block;
            border-radius: 8px;
        }
        .controls-hint {
            margin-top: 10px;
            font-size: 12px;
            color: #8be9fd;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>THUNDERSTORM SURVIVAL ⚡</h1>
        <div class="subtitle">Dedicated with Love to Nadeesha ❤️</div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas" width="360" height="500"></canvas>
    </div>

    <div class="controls-hint">
        👈 / 👉 ඊතල (Arrow Keys) හෝ Screen Touch පාවිච්චි කරලා Lightning බේරෙන්න!
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Player (Nadeesha's Character/Heart)
        let player = {
            x: canvas.width / 2 - 15,
            y: canvas.height - 50,
            width: 30,
            height: 30,
            speed: 6,
            dx: 0
        };

        // Game Variables
        let score = 0;
        let gameOver = false;
        let bolts = [];
        let spawnRate = 35;
        let frameCount = 0;

        // Controls (Keyboard)
        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowLeft" || e.key === "a") player.dx = -player.speed;
            if (e.key === "ArrowRight" || e.key === "d") player.dx = player.speed;
        });

        document.addEventListener("keyup", (e) => {
            if (["ArrowLeft", "ArrowRight", "a", "d"].includes(e.key)) player.dx = 0;
        });

        // Touch Control for Mobile
        canvas.addEventListener("touchstart", (e) => {
            let touchX = e.touches[0].clientX - canvas.getBoundingClientRect().left;
            if (touchX < canvas.width / 2) player.dx = -player.speed;
            else player.dx = player.speed;
        });

        canvas.addEventListener("touchend", () => player.dx = 0);

        // Random Helper
        function rand(min, max) {
            return Math.random() * (max - min) + min;
        }

        // Spawn Lightning Bolts
        function spawnLightning() {
            bolts.push({
                x: rand(20, canvas.width - 20),
                y: 0,
                radius: rand(10, 16),
                speed: rand(4, 8)
            });
        }

        // AABB Circle Collision Detection
        function checkCollision(px, py, pw, ph, cx, cy, cr) {
            let nearestX = Math.max(px, Math.min(cx, px + pw));
            let nearestY = Math.max(py, Math.min(cy, py + ph));
            let dx = cx - nearestX;
            let dy = cy - nearestY;
            return (dx * dx + dy * dy) <= (cr * cr);
        }

        function update() {
            if (gameOver) return;

            // Move Player
            player.x += player.dx;
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

            // Spawn Control
            frameCount++;
            if (frameCount % spawnRate === 0) {
                spawnLightning();
                if (spawnRate > 12) spawnRate--; 
            }

            // Update Bolts
            for (let i = bolts.length - 1; i >= 0; i--) {
                let b = bolts[i];
                b.y += b.speed;

                // Check collision with player
                if (checkCollision(player.x, player.y, player.width, player.height, b.x, b.y, b.radius)) {
                    gameOver = true;
                }

                // Remove off-screen & score increase
                if (b.y > canvas.height) {
                    bolts.splice(i, 1);
                    score += 10;
                }
            }
        }

        function draw() {
            // Clear Background
            ctx.fillStyle = "#05020a";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Player (Glowing Pink Heart)
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#ff2a85";
            ctx.fillStyle = "#ff79c6";
            ctx.beginPath();
            ctx.arc(player.x + player.width/2, player.y + player.height/2, player.width/2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Draw Lightning Bolts
            bolts.forEach(b => {
                ctx.shadowBlur = 10;
                ctx.shadowColor = "#8be9fd";
                ctx.fillStyle = "#ffb86c";
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.shadowBlur = 0;

            // UI Text (Score & Name)
            ctx.fillStyle = "#ff79c6";
            ctx.font = "bold 14px sans-serif";
            ctx.fillText("SCORE: " + score, 15, 25);
            ctx.fillText("NADEESHA ❤️", canvas.width - 120, 25);

            // Game Over Screen
            if (gameOver) {
                ctx.fillStyle = "rgba(5, 2, 10, 0.85)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.fillStyle = "#ff2a85";
                ctx.font = "bold 24px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("OOH NO! GAME OVER", canvas.width / 2, canvas.height / 2 - 20);

                ctx.fillStyle = "#f8f8f2";
                ctx.font = "15px sans-serif";
                ctx.fillText("Final Score: " + score, canvas.width / 2, canvas.height / 2 + 15);
                ctx.fillText("Tap to Restart ❤️", canvas.width / 2, canvas.height / 2 + 45);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        // Restart on click/touch when game over
        canvas.addEventListener("click", () => {
            if (gameOver) {
                gameOver = false;
                score = 0;
                bolts = [];
                spawnRate = 35;
                player.x = canvas.width / 2 - 15;
            }
        });

        gameLoop();
    </script>
</body>
</html>
