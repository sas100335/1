<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frost Breakout ❄️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #030712;
            color: #38bdf8;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        h1 {
            font-size: 22px;
            margin-bottom: 10px;
            color: #38bdf8;
            text-shadow: 0 0 15px #0284c7;
        }
        #game-container {
            position: relative;
            border: 3px solid #38bdf8;
            border-radius: 10px;
            box-shadow: 0 0 25px #0284c7;
            background: #00050f;
        }
        canvas {
            display: block;
            border-radius: 8px;
            touch-action: none;
        }
        .hint {
            margin-top: 10px;
            font-size: 13px;
            color: #7dd3fc;
        }
    </style>
</head>
<body>

    <h1>FROST BREAKOUT ❄️</h1>
    <div id="game-container">
        <canvas id="gameCanvas" width="360" height="520"></canvas>
    </div>
    <div class="hint">👈 / 👉 Drag Paddle to Break Bricks</div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Web Audio API Sound System
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'hit') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } else if (type === 'paddle') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(250, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(500, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'gameover') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(250, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(70, audioCtx.currentTime + 0.4);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.4);
            }
        }

        // Game Variables
        let score = 0;
        let level = 1;
        let lives = 3;
        let gameOver = false;

        // Paddle Properties
        const paddleWidth = 75;
        const paddleHeight = 12;
        let paddleX = (canvas.width - paddleWidth) / 2;
        let rightPressed = false;
        let leftPressed = false;

        // Ball Properties
        let ballRadius = 7;
        let x = canvas.width / 2;
        let y = canvas.height - 45;
        let dx = 3;
        let dy = -3;

        // Bricks Layout
        const brickRowCount = 5;
        const brickColumnCount = 6;
        const brickWidth = 50;
        const brickHeight = 18;
        const brickPadding = 6;
        const brickOffsetTop = 50;
        const brickOffsetLeft = 14;

        let bricks = [];
        function initBricks() {
            bricks = [];
            for (let c = 0; c < brickColumnCount; c++) {
                bricks[c] = [];
                for (let r = 0; r < brickRowCount; r++) {
                    bricks[c][r] = { x: 0, y: 0, status: 1 };
                }
            }
        }
        initBricks();

        // Keyboard Controls
        document.addEventListener("keydown", (e) => {
            if (e.key === "ArrowRight") rightPressed = true;
            else if (e.key === "ArrowLeft") leftPressed = true;
        });
        document.addEventListener("keyup", (e) => {
            if (e.key === "ArrowRight") rightPressed = false;
            else if (e.key === "ArrowLeft") leftPressed = false;
        });

        // Touch Control
        canvas.addEventListener("touchmove", (e) => {
            let relativeX = e.touches[0].clientX - canvas.getBoundingClientRect().left;
            if (relativeX > 0 && relativeX < canvas.width) {
                paddleX = relativeX - paddleWidth / 2;
            }
        });

        canvas.addEventListener("mousemove", (e) => {
            let relativeX = e.clientX - canvas.offsetLeft;
            if (relativeX > 0 && relativeX < canvas.width) {
                paddleX = relativeX - paddleWidth / 2;
            }
        });

        // Collision Detection
        function collisionDetection() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    let b = bricks[c][r];
                    if (b.status === 1) {
                        if (x > b.x && x < b.x + brickWidth && y > b.y && y < b.y + brickHeight) {
                            dy = -dy;
                            b.status = 0;
                            score += 10;
                            playSound('hit');

                            if (score === brickRowCount * brickColumnCount * 10 * level) {
                                level++;
                                initBricks();
                                x = canvas.width / 2;
                                y = canvas.height - 45;
                                dx += 1;
                                dy = -Math.abs(dy) - 1;
                            }
                        }
                    }
                }
            }
        }

        function drawBall() {
            ctx.shadowBlur = 12;
            ctx.shadowColor = "#38bdf8";
            ctx.beginPath();
            ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
            ctx.fillStyle = "#e0f2fe";
            ctx.fill();
            ctx.closePath();
            ctx.shadowBlur = 0;
        }

        function drawPaddle() {
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#0284c7";
            ctx.beginPath();
            ctx.rect(paddleX, canvas.height - paddleHeight - 15, paddleWidth, paddleHeight);
            ctx.fillStyle = "#38bdf8";
            ctx.fill();
            ctx.closePath();
            ctx.shadowBlur = 0;
        }

        function drawBricks() {
            for (let c = 0; c < brickColumnCount; c++) {
                for (let r = 0; r < brickRowCount; r++) {
                    if (bricks[c][r].status === 1) {
                        let brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
                        let brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
                        bricks[c][r].x = brickX;
                        bricks[c][r].y = brickY;

                        ctx.shadowBlur = 8;
                        ctx.shadowColor = "#0284c7";
                        ctx.beginPath();
                        ctx.rect(brickX, brickY, brickWidth, brickHeight);
                        ctx.fillStyle = r % 2 === 0 ? "#0284c7" : "#38bdf8";
                        ctx.fill();
                        ctx.closePath();
                        ctx.shadowBlur = 0;
                    }
                }
            }
        }

        function drawUI() {
            ctx.font = "bold 13px 'Courier New', monospace";
            ctx.fillStyle = "#38bdf8";
            ctx.fillText("SCORE: " + String(score).padStart(6, '0'), 15, 25);
            ctx.fillText("LVL " + level, canvas.width / 2 - 20, 25);
            ctx.fillText("❄️ " + lives, canvas.width - 45, 25);
        }

        function draw() {
            ctx.fillStyle = "#00050f";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawBricks();
            drawBall();
            drawPaddle();
            drawUI();
            collisionDetection();

            // Wall bounce (Left/Right)
            if (x + dx > canvas.width - ballRadius || x + dx < ballRadius) {
                dx = -dx;
                playSound('hit');
            }

            // Wall bounce (Top)
            if (y + dy < ballRadius + 30) {
                dy = -dy;
                playSound('hit');
            } else if (y + dy > canvas.height - paddleHeight - 15 - ballRadius) {
                if (x > paddleX && x < paddleX + paddleWidth) {
                    dy = -dy;
                    playSound('paddle');
                } else if (y + dy > canvas.height - ballRadius) {
                    lives--;
                    playSound('gameover');
                    if (!lives) {
                        gameOver = true;
                    } else {
                        x = canvas.width / 2;
                        y = canvas.height - 45;
                        dx = 3;
                        dy = -3;
                        paddleX = (canvas.width - paddleWidth) / 2;
                    }
                }
            }

            if (rightPressed && paddleX < canvas.width - paddleWidth) paddleX += 6;
            else if (leftPressed && paddleX > 0) paddleX -= 6;

            x += dx;
            y += dy;

            if (gameOver) {
                ctx.fillStyle = "rgba(0, 5, 15, 0.9)";
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                ctx.shadowBlur = 15;
                ctx.shadowColor = "#38bdf8";
                ctx.fillStyle = "#38bdf8";
                ctx.font = "bold 22px 'Courier New', monospace";
                ctx.textAlign = "center";
                ctx.fillText("FROST BREAKOUT", canvas.width / 2, canvas.height / 2 - 20);
                ctx.font = "15px 'Courier New', monospace";
                ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 + 10);
                ctx.fillText("Tap to Restart ❄️", canvas.width / 2, canvas.height / 2 + 40);
            } else {
                requestAnimationFrame(draw);
            }
        }

        canvas.addEventListener("click", () => {
            if (gameOver) {
                gameOver = false;
                score = 0;
                lives = 3;
                level = 1;
                dx = 3;
                dy = -3;
                initBricks();
                x = canvas.width / 2;
                y = canvas.height - 45;
                draw();
            }
        });

        draw();
    </script>
</body>
</html>
