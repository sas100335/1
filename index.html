<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Special Love Quiz for Hasini ❤️</title>
<style>
*{box-sizing:border-box;font-family:'Poppins', sans-serif;}
body{
margin:0;min-height:100vh;overflow-x:hidden;
background:linear-gradient(135deg,#2b0b1f,#5c123d,#1a0414);
color:#fff;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;
}
.card{
background:rgba(255, 255, 255, 0.1);backdrop-filter:blur(15px);
border:2px solid rgba(255, 105, 180, 0.4);border-radius:25px;
padding:30px 20px;max-width:400px;width:100%;box-shadow:0 0 30px rgba(255,0,128,0.4);
position:relative;z-index:2;
}
h1{color:#ff99cc;font-size:24px;margin-bottom:15px;text-shadow:0 0 10px #ff007f;}
p{font-size:16px;line-height:1.6;color:#ffe6f2;margin-bottom:25px;}
.btn-group{display:flex;justify-content:center;gap:15px;position:relative;margin-top:20px;}
button{
padding:12px 25px;font-size:16px;font-weight:bold;border:none;border-radius:25px;cursor:pointer;transition:0.2s;
}
#yesBtn{background:#ff3385;color:white;box-shadow:0 0 15px #ff0066;}
#noBtn{background:#ffffff;color:#5c123d;box-shadow:0 0 10px rgba(255,255,255,0.5);position:relative;}
.quiz-container{display:none;text-align:left;}
.quiz-option{
display:block;background:rgba(255,255,255,0.15);padding:10px 15px;margin:10px 0;border-radius:15px;cursor:pointer;border:1px solid rgba(255,255,255,0.3);transition:0.3s;
}
.quiz-option:hover{background:rgba(255,51,133,0.4);border-color:#ff3385;}
#resultText{display:none;font-size:20px;color:#ff99cc;font-weight:bold;margin-top:20px;}
.heart{
position:fixed;bottom:-40px;pointer-events:none;z-index:1;animation:rise linear forwards;
}
@keyframes rise{
to{transform:translateY(-115vh) rotate(360deg);opacity:0;}
}
</style>
</head>
<body>

<div class="card" id="mainCard">
    <!-- Part 1: Do You Love Me? -->
    <div id="proposalSection">
        <h1>Hey Hasini! 💖</h1>
        <p>Do you love me as much as I love you? ✨</p>
        <div class="btn-group">
            <button id="yesBtn" onclick="startQuiz()">Yes! 🥰</button>
            <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No 😜</button>
        </div>
    </div>

    <!-- Part 2: Mini Love Quiz -->
    <div id="quizSection" class="quiz-container">
        <h1>Love Quiz 💕</h1>
        <p id="questionText">1. Where do you hold the most special place?</p>
        <div id="optionsGroup">
            <div class="quiz-option" onclick="nextQuestion(1)">In my mind 💭</div>
            <div class="quiz-option" onclick="nextQuestion(2)">Deep inside my heart ❤️</div>
            <div class="quiz-option" onclick="nextQuestion(1)">Nowhere 🙄</div>
        </div>
    </div>

    <!-- Part 3: Final Result -->
    <div id="resultText">
        🎉 Yay! You got a 100% match in my heart, Hasini! Forever yours, Vinoth ❤️💖
    </div>
</div>

<script>
// Move 'No' button playfully
function moveButton() {
    const noBtn = document.getElementById('noBtn');
    const x = (Math.random() - 0.5) * 160;
    const y = (Math.random() - 0.5) * 160;
    noBtn.style.transform = `translate(${x}px, ${y}px)`;
}

// Start Quiz after clicking Yes
function startQuiz() {
    document.getElementById('proposalSection').style.display = 'none';
    document.getElementById('quizSection').style.display = 'block';
    startHeartRain();
}

let qStep = 1;
function nextQuestion(score) {
    const qText = document.getElementById('questionText');
    const optGroup = document.getElementById('optionsGroup');
    
    if (qStep === 1) {
        qStep++;
        qText.textContent = "2. What makes my day instantly brighter? 😊";
        optGroup.innerHTML = `
            <div class="quiz-option" onclick="showFinal()">Your beautiful smile ✨</div>
            <div class="quiz-option" onclick="showFinal()">Drinking tea ☕</div>
            <div class="quiz-option" onclick="showFinal()">Nothing 🌙</div>
        `;
    }
}

function showFinal() {
    document.getElementById('quizSection').style.display = 'none';
    document.getElementById('resultText').style.display = 'block';
    startHeartRain();
    startHeartRain();
}

// Heart Rain Animation
function startHeartRain() {
    for(let j=0; j<35; j++) {
        setTimeout(makeHeart, j * 80);
    }
}

function makeHeart(){
    const h = document.createElement('span');
    h.className = 'heart';
    h.textContent = ['❤️','💗','💕','💖','✨'][Math.floor(Math.random()*5)];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (16 + Math.random() * 20) + 'px';
    h.style.animationDuration = (3 + Math.random() * 3) + 's';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 6000);
}
</script>

</body>
</html>
