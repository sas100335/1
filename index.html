<html lang="en">
<head>

    <title>Sasmitha & Nadeesha - Our Love Story</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #1a002c 0%, #3d0066 50%, #5c0099 100%);
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px;
            overflow-x: hidden;
            position: relative;
        }

        /* Snowflake / Star Animation */
        .particle {
            position: absolute;
            top: -10px;
            background: rgba(230, 190, 255, 0.8);
            border-radius: 50%;
            pointer-events: none;
            animation: fall linear infinite;
        }
        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }

        /* Container */
        .container {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 25px 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            text-align: center;
            z-index: 10;
            margin-top: 10px;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 2.8rem;
            color: #f3cfff;
            text-shadow: 0 0 10px #d882ff;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #e0b0ff;
            margin-bottom: 20px;
        }

        /* Counter Box */
        .time-box {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid rgba(224, 176, 255, 0.3);
        }
        .time-title {
            font-size: 0.85rem;
            color: #d882ff;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
