<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Nadeesha</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <style>
        /* මූලික සැකසුම් - Full Screen */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Scrollbar අයින් කිරීමට */
            background: linear-gradient(135deg, #2e0249 0%, #540375 100%); /* තද දම් පාට පසුබිම */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Dancing+Script', cursive;
            color: #ffffff;
        }

        /* මැද තියෙන නම - Nadeesha */
        .name-container {
            text-align: center;
            z-index: 10; /* හිම වලට වඩා උඩින් තැබීමට */
            position: relative;
        }

        h1 {
            font-family: 'Dancing Script', cursive;
            font-size: 4rem; /* ෆොන්ට් එකේ ප්‍රමාණය */
            margin: 0;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8), 
                         0 0 30px rgba(212, 163, 255, 0.6); /* සුදු සහ ලා දම් පාට Glow එක */
            letter-spacing: 2px;
            animation: fadeInName 3s ease-in-out; /* පෙනී යන Animation එක */
        }

        /* නම පෙනී යන Animation එක */
        @keyframes fadeInName {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* හිම වැටෙන කලාපය */
        .snowflake {
            position: absolute;
            top: -10px;
            z-index: 1;
            border-radius: 50%;
            background: rgba(230, 190, 255, 0.8); /* ලා දම්/සුදු පාට හිම */
            pointer-events: none; /* ස්පර්ශ නොවන ලෙස */
            animation: fall linear infinite; /* වැටෙන Animation එක */
        }

        /* හිම වැටෙනAnimation එක */
        @keyframes fall {
            to {
                transform: translateY(105vh) translateX(20px); /* පහළට සහ ස්වල්පයක් දකුණට */
            }
        }
    </style>
</head>
<body>

    <!-- මැද නම -->
    <div class="name-container">
        <h1>Nadeesha</h1>
    </div>

    <!-- හිම වැටෙන JavaScript -->
    <script>
        function createSnowflake() {
            const snowflake = document.createElement('div');
            snowflake.classList.add('snowflake');
            
            // අහඹු ප්‍රමාණය (Size)
            const size = Math.random() * 5 + 2 + 'px';
            snowflake.style.width = size;
            snowflake.style.height = size;
            
            // අහඹු ආරම්භක ස්ථානය (Left)
            snowflake.style.left = Math.random() * 100 + 'vw';
            
            // අහඹු වැටෙන වේගය (Duration)
            snowflake.style.animationDuration = Math.random() * 3 + 2 + 's'; // 2-5 තත්පර
            
            // ස්වල්පයක් විනිවිද පෙනෙන ස්වභාවය
            snowflake.style.opacity = Math.random();

            document.body.appendChild(snowflake);

            // තත්පර 5කට පසු හිම කැටය මකා දැමීම (Memory ඉතිරි කිරීමට)
            setTimeout(() => {
                snowflake.remove();
            }, 5000);
        }

        // සෑම තත්පර 0.1කට වරක්ම අලුත් හිම කැටයක් සෑදීම
        setInterval(createSnowflake, 100);
    </script>

</body>
</html>
